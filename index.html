
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bev & Ryan | Household Budget</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f3ed;color:#35443b;font-family:Arial,sans-serif;padding:20px}
main{max-width:520px;margin:35px auto;background:white;padding:25px;border-radius:18px;box-shadow:0 4px 20px #00000010}
h1{color:#526b58;font-size:25px;margin-bottom:5px}
p{color:#69766d;line-height:1.5}
input,button{width:100%;padding:13px;margin:8px 0;border-radius:9px;font-size:16px}
input{border:1px solid #d8ded7}
button{background:#617d66;color:white;border:0;font-weight:bold}
#status{font-size:14px;margin-top:15px}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>Our Household Budget 💚</h1>
<p>Bev & Ryan</p>

<section id="login">
<h3>Welcome back</h3>
<p>Log in using your personal email and app password.</p>
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="App password">
<button id="loginBtn">Log in</button>
<p id="error"></p>
</section>

<section id="app" class="hidden">
<h3 id="welcome"></h3>
<p>Your shared household budget is connected.</p>
<p id="sync">Connecting to your budget...</p>
<button id="logoutBtn">Log out</button>
</section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDS5u74JV9q_MekOPh6Gy8WGqzqoImFdeo",
  authDomain: "bev-and-ryan-household-budget.firebaseapp.com",
  projectId: "bev-and-ryan-household-budget",
  storageBucket: "bev-and-ryan-household-budget.firebasestorage.app",
  messagingSenderId: "860050864828",
  appId: "1:860050864828:web:71a1ff960629cd96b9aeb9"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const loginSection = document.getElementById("login");
const appSection = document.getElementById("app");
const errorText = document.getElementById("error");

document.getElementById("loginBtn").onclick = async () => {
  errorText.textContent = "";
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    await auth.signInWithEmailAndPassword(email, password);
  } catch (error) {
    errorText.textContent = "Login unsuccessful. Please check your email and password.";
  }
};

auth.onAuthStateChanged(async user => {
  if (!user) {
    loginSection.classList.remove("hidden");
    appSection.classList.add("hidden");
    return;
  }

  loginSection.classList.add("hidden");
  appSection.classList.remove("hidden");
  document.getElementById("welcome").textContent =
    "Welcome, " + (user.email || "household member");

  const sync = document.getElementById("sync");

  try {
    const ref = db.collection("household").doc("sharedBudget");
    await ref.set({
      lastOpenedBy: user.email,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });

    ref.onSnapshot(doc => {
      sync.textContent = doc.exists
        ? "✓ Your shared budget is syncing successfully."
        : "Waiting for budget data...";
    }, () => {
      sync.textContent = "Unable to sync. Please check your connection.";
    });
  } catch (error) {
    sync.textContent = "Database connection unsuccessful. Please try again.";
  }
});

document.getElementById("logoutBtn").onclick = () => auth.signOut();
</script>
</body>
</html>
